# Site settings
title: "Chris Hawley"
email: "chhawley@calpoly.edu"
description: "Mechanical engineering portfolio showcasing design projects and experience."
url: "https://HawleyChris01.github.io"
repository: "HawleyChris01/HawleyChris01.github.io"
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Los_Angeles

include:
  - _pages

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Chris Hawley"
  avatar : "/assets/images/Professional Headshot 2026.png"
  bio    : "Mechanical engineering student at Cal Poly interested in design, manufacturing, and embedded systems."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/chris-hawley-7aba32313/"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/chris-hawley-7aba32313/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/